<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>🗺️ 學習大冒險</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#123c59;color:#fff;font:700 18px -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;transition:background .6s}
main{max-width:1000px;margin:auto;padding:12px 12px 40px}
header{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:4px 4px 10px}
h1{font-size:25px;margin:0}
.kids{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;border:0;border-radius:14px;padding:10px 16px;min-height:50px;cursor:pointer;background:#ffdb56;color:#573d19}
button.kid{background:rgba(255,255,255,.15);color:#fff;border:3px solid transparent}
button.kid.on{border-color:#ffdb56;background:rgba(255,255,255,.28)}
/* 右上角帳號卡（資料來自英文口說 App） */
.acct{display:flex;align-items:center;gap:12px;background:rgba(0,0,0,.28);border-radius:18px;padding:8px 14px 8px 10px;min-width:260px}
.acct .info{flex:1;min-width:0;line-height:1.3}
.acct .nm{font-size:19px}
.acct .lvt{display:inline-block;background:#15151f;border-radius:8px;padding:1px 8px;font-size:15px;margin-top:2px;white-space:nowrap;text-shadow:0 0 6px currentColor}
.acct .xp{height:8px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden;margin:5px 0 2px}
.acct .xp i{display:block;height:100%;background:linear-gradient(90deg,#ffd43b,#ff922b);border-radius:99px}
.acct .meta{font-size:13px;font-weight:500;opacity:.85;display:flex;justify-content:space-between;gap:8px}
.acct .kst{font-size:14px;font-weight:700;line-height:1.5;white-space:nowrap;padding:2px 10px;border-left:1px solid rgba(255,255,255,.25);border-right:1px solid rgba(255,255,255,.25)}
@media (max-width:560px){.acct{flex-wrap:wrap}.acct .kst{order:5;flex-basis:100%;display:flex;flex-wrap:wrap;gap:2px 12px;border:0;border-top:1px solid rgba(255,255,255,.25);padding:6px 0 0}}
.acct .kst .ok{color:#8ce99a}.acct .kst .no{color:#ffc078}.acct .kst b{color:#fff}
.acct .pts{font-size:20px;font-weight:800;color:#ffdb56;white-space:nowrap;text-align:right;line-height:1.2}
.acct .pts small{display:block;margin:0;font-size:12px;color:rgba(255,255,255,.7)}
.others{display:flex;gap:6px}
.others button{min-height:0;padding:0;border-radius:50%;background:none}
.others button.sw{display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:14px;padding:6px 8px;background:rgba(0,0,0,.22);color:#fff}
.others button.sw span{font-size:13px;font-weight:700;white-space:nowrap}
.avatar{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;overflow:hidden;flex:none;color:#fff;font-weight:800;line-height:1;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.avatar img{width:100%;height:100%;object-fit:cover}
.avwrap{position:relative;display:inline-flex;flex:none;border-radius:50%}
.avwrap .avatar{position:relative;z-index:1}
.avwrap .avlv{position:absolute;right:-8px;bottom:-5px;z-index:3;background:#15151f;border:2px solid;border-radius:99px;font-size:12px;font-weight:900;padding:0 5px;line-height:16px;white-space:nowrap}
.avwrap .avcrown{position:absolute;left:50%;top:0;transform:translate(-50%,-62%) rotate(-10deg);z-index:3;line-height:1;font-size:22px}
.avwrap.t1 .avatar{box-shadow:0 0 0 3px #69db7c}
.avwrap.t2 .avatar{box-shadow:0 0 0 3px #4dabf7,0 0 12px 3px rgba(77,171,247,.65)}
.avwrap.t3 .avatar{box-shadow:0 0 0 3px #b197fc;animation:avglow 1.8s ease-in-out infinite}
@keyframes avglow{50%{box-shadow:0 0 0 3px #9775fa,0 0 18px 7px rgba(151,117,250,.8)}}
.avwrap.t4::before,.avwrap.t5::before{content:"";position:absolute;inset:-5px;border-radius:50%;z-index:0;animation:avspin 3s linear infinite}
.avwrap.t4::before{background:conic-gradient(#ffd43b,#fff9db,#fab005,#fff9db,#ffd43b);box-shadow:0 0 12px 2px rgba(250,176,5,.6)}
.avwrap.t5::before{inset:-6px;background:conic-gradient(#ff6b6b,#ffd43b,#69db7c,#4dabf7,#cc5de8,#ff6b6b);box-shadow:0 0 16px 4px rgba(204,93,232,.55)}
@keyframes avspin{to{transform:rotate(360deg)}}
/* 🎁 開寶箱（跟英文口說 App 一樣的動畫） */
.chestpop{position:fixed;inset:0;z-index:95;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 45%,var(--chbg,rgba(60,30,110,.88)),rgba(8,5,20,.99));color:#fff;text-align:center;padding:16px;animation:chFade .35s both;user-select:none;-webkit-user-select:none;cursor:pointer;overflow:hidden}
@keyframes chFade{from{opacity:0}to{opacity:1}}
.chestpop h3{margin:0 0 4px;font-size:26px;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.chestpop .chsub{font-size:16px;opacity:.85;min-height:22px}
.chestpop .chstage{position:relative;width:min(300px,78vw);height:min(260px,62vw);margin:10px 0 4px}
.chestpop .chrays{position:absolute;left:50%;top:52%;width:620px;height:620px;margin:-310px 0 0 -310px;border-radius:50%;opacity:0;background:repeating-conic-gradient(from 0deg,var(--chray,rgba(255,224,102,.55)) 0deg 9deg,transparent 9deg 22.5deg);-webkit-mask:radial-gradient(circle,#000 18%,transparent 62%);mask:radial-gradient(circle,#000 18%,transparent 62%);transition:opacity .4s}
.chestpop.open .chrays{opacity:1;animation:chSpin 9s linear infinite}
@keyframes chSpin{to{transform:rotate(360deg)}}
.chestpop svg.chest{position:absolute;inset:0;width:100%;height:100%;overflow:visible;animation:chDrop .7s cubic-bezier(.3,1.6,.5,1) both}
@keyframes chDrop{0%{transform:translateY(-120%) scale(.6)}100%{transform:none}}
.chestpop.idle svg.chest{animation:chDrop .7s cubic-bezier(.3,1.6,.5,1) both,chWob 1.6s .7s ease-in-out infinite}
@keyframes chWob{0%,60%,100%{transform:rotate(0)}68%{transform:rotate(-5deg)}76%{transform:rotate(5deg)}84%{transform:rotate(-3deg)}92%{transform:rotate(2deg)}}
.chestpop.shake svg.chest{animation:chShake .09s linear infinite}
@keyframes chShake{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(-4px,1px) rotate(-2deg)}50%{transform:translate(3px,-2px) rotate(2deg)}75%{transform:translate(-2px,2px) rotate(-1deg)}}
.chestpop svg .lid{transform-box:fill-box;transform-origin:50% 100%;transition:transform .55s cubic-bezier(.3,1.5,.5,1)}
.chestpop.open svg .lid{transform:translate(0,-38px) rotate(-24deg)}
.chestpop svg .glow{opacity:0;transition:opacity .3s}
.chestpop.open svg .glow{opacity:1}
.chestpop svg .gem{animation:chGem 1.2s ease-in-out infinite}
@keyframes chGem{50%{filter:brightness(1.6)}}
.chestpop .chslot{font-size:clamp(44px,13vw,72px);font-weight:900;min-height:1.2em;letter-spacing:1px;color:#ffe066;text-shadow:0 0 18px rgba(255,200,0,.7),0 3px 0 #b8860b;font-variant-numeric:tabular-nums}
.chestpop .chslot.spin{filter:blur(.6px);opacity:.9}
.chestpop .chslot.win{animation:chWin .6s cubic-bezier(.3,1.8,.5,1) both}
@keyframes chWin{0%{transform:scale(.4)}100%{transform:scale(1)}}
.chestpop .chrare{display:inline-block;margin-top:4px;padding:4px 14px;border-radius:999px;font-weight:900;font-size:18px;border:2px solid currentColor;background:rgba(0,0,0,.35);opacity:0}
.chestpop .chrare.show{opacity:1}
.chestpop .chtap{margin-top:12px;font-size:18px;font-weight:800;animation:chBlink 1s ease-in-out infinite}
@keyframes chBlink{50%{opacity:.35}}
.chestpop .coin{position:absolute;left:50%;top:50%;font-size:26px;pointer-events:none;animation:chCoin 1.3s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes chCoin{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1) rotate(var(--r));opacity:0}}
.chestpop .chtable{margin-top:10px;font-size:13px;opacity:.75}
.chestpop[data-tier="gold"].open svg.chest{filter:drop-shadow(0 0 24px rgba(255,212,59,.9))}
.chico{display:inline-block;width:1.5em;height:1.3em;vertical-align:-.25em;margin:0 .15em}
.chico svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.exam{display:flex;align-items:center;gap:12px;background:rgba(255,250,240,.95);color:#3b2a14;border-radius:16px;padding:10px 14px;margin:0 0 10px;font-size:16px;font-weight:500}
.exam b{font-size:18px}
.exam .eb{flex:1;min-width:0}
.exam .bar2{height:10px;background:#eadfce;border-radius:99px;overflow:hidden;margin:5px 0 2px}
.exam .bar2 i{display:block;height:100%;background:linear-gradient(90deg,#b197fc,#7048e8);border-radius:99px}
.exam button{min-height:48px;background:#7048e8;color:#fff;font-size:16px;white-space:nowrap}
.exam .chico{width:2.4em;height:2em}
.chline{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:#f1fbf3;border:2px solid #cdebd3;border-radius:14px;padding:8px 12px;margin:8px 0;font-weight:500;font-size:16px}
/* 世界切換列 */
.nav{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.nav .arrow{min-width:56px;min-height:56px;font-size:26px;padding:0;background:rgba(255,255,255,.92);color:#3b2a14}
.nav .arrow:disabled{opacity:.3}
.wtitle{flex:1;text-align:center;line-height:1.25}
.wtitle b{display:block;font-size:22px}
.wicon img{width:58px;height:58px;display:block;margin:-6px auto 0;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}
.wtitle span{font-size:15px;font-weight:500;opacity:.85}
.dots{display:flex;justify-content:center;gap:8px;margin-top:6px}
.dots i{width:12px;height:12px;border-radius:99px;background:rgba(255,255,255,.35);cursor:pointer}
.dots i.on{background:#ffdb56;width:28px}
/* 書本和翻頁 */
.book{position:relative;perspective:2400px;border-radius:18px}
.book canvas{width:100%;display:block;touch-action:pan-y;border-radius:18px;box-shadow:0 8px 25px rgba(0,0,0,.45)}
.leaf{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;display:none;z-index:4;pointer-events:none}
.leaf.anim{transition:transform 1.15s cubic-bezier(.55,.05,.35,1)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;overflow:hidden}
.face canvas{width:100%;height:100%;box-shadow:none;border-radius:0}
.back{transform:rotateY(180deg);background:linear-gradient(90deg,#d9c39a,#f6ead0 12%,#fbf3e1 50%,#efe0bf);display:flex;align-items:center;justify-content:center;color:#8a6a3a;font-size:30px}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,0,0,.35));opacity:0;transition:opacity 1.15s}
.leaf.turning .shade{opacity:1}
.under{position:absolute;inset:0;border-radius:18px;background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(0,0,0,0) 45%);opacity:0;transition:opacity 1.15s;pointer-events:none;z-index:3}
.under.on{opacity:1}
/* 六維雷達圖 */
.setup{background:#fffaf0;color:#3b2a14;border-radius:18px;padding:14px 16px;margin:0 0 12px;font-weight:500;font-size:16px;line-height:1.6}
.setup h3{margin:0 0 4px;font-size:20px}
.setup label{display:block;margin-top:8px;font-weight:700}
.setup input{width:100%;font:inherit;font-size:17px;padding:10px;border:2px solid #eadfce;border-radius:10px;margin-top:4px}
.setup button{margin-top:10px;width:100%}
.radar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:rgba(255,255,255,.1);border-radius:18px;padding:10px 14px;margin:0 0 12px;position:relative}
.radar svg{width:min(100%,440px);height:auto;display:block;flex:0 0 auto;margin:auto}
.radar .vx{cursor:pointer}
.radar .vx:hover .dot,.radar .vx.on .dot{r:11}
.radar .badge{transition:transform .2s;transform-box:fill-box;transform-origin:center}
.radar .vx:hover .badge,.radar .vx.on .badge{transform:scale(1.15)}
.rsum{flex:1 1 220px;font-weight:500;font-size:16px;line-height:1.6}
.rsum b{font-size:20px}
.rsum .big{font-size:34px;color:#ffdb56;font-weight:800}
.rtip{position:absolute;z-index:7;width:290px;background:#fffaf0;color:#3b2a14;border-radius:14px;padding:10px 14px;box-shadow:0 8px 22px #0006;font-size:15px;font-weight:500;line-height:1.55;display:none}
.rtip h3{margin:0 0 2px;font-size:18px}
.rtip .st{color:#f0b400;font-size:20px;letter-spacing:2px}
.rtip button{width:100%;min-height:46px;margin-top:8px;background:#ff8a3d;color:#fff;font-size:17px}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:10px 2px}
#score{font-size:19px}
.panel{background:#fffaf0;color:#3b2a14;border-radius:18px;padding:16px 18px;box-shadow:0 6px 18px #0004}
.panel h2{margin:2px 0 4px;font-size:24px}
.sub{color:#7a6650;font-weight:500;font-size:17px;margin:2px 0}
.tagp{display:inline-block;background:#1f8fd0;color:#fff;border-radius:10px;padding:2px 10px;font-size:19px;vertical-align:2px}
.stars{font-size:32px;letter-spacing:3px;color:#f0b400;margin:4px 0}
.off{color:#d9cbb6}
.cnt{font-size:17px;color:#7a6650;letter-spacing:0;vertical-align:5px}
.teacher{background:#f3f9ff;border:2px solid #cfe6fb;border-radius:14px;padding:10px 14px;margin:10px 0;font-weight:500;font-size:17px;line-height:1.6}
.teacher b{color:#1f6fa6}
.teacher ul{margin:4px 0 0;padding-left:22px}
.hist,.rule{font-size:15px;color:#7a6650;font-weight:500}
.rule{margin-top:8px}
.go{width:100%;min-height:66px;font-size:23px;background:#ff8a3d;color:#fff;margin-top:10px}
.go:active{background:#e56f22}
.go:disabled{background:#cbbfae}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#fffaf0;color:#3b2a14;padding:10px 18px;border-radius:99px;box-shadow:0 6px 18px #0005;font-size:19px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:92%;text-align:center;z-index:6}
.toast.show{opacity:1}
.tip{position:absolute;z-index:5;width:300px;background:#fffaf0;color:#3b2a14;border-radius:14px;padding:10px 14px;box-shadow:0 8px 22px #0006;font-size:15px;font-weight:500;line-height:1.55;pointer-events:none;display:none}
.tip h3{margin:0 0 2px;font-size:17px}
.tip .st{color:#f0b400;font-size:20px;letter-spacing:2px}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:22px;color:#fff;text-shadow:0 2px 6px #000;pointer-events:none;z-index:2}
small{display:block;color:rgba(255,255,255,.8);font-weight:500;font-size:15px;margin-top:12px;line-height:1.5}
</style>
</head>
<body>
<main>
  <header><h1>🗺️ 學習大冒險</h1><div class="kids" id="kids"></div></header>
  <div class="setup" id="setupCard" style="display:none"></div>
  <div class="radar" id="radar"><svg id="radarSvg" viewBox="0 0 460 400" aria-label="六科能力雷達圖"></svg><div class="rsum" id="rsum"></div><div class="rtip" id="rtip"></div></div>
  <div class="nav">
    <button class="arrow" id="prev" aria-label="上一個世界">◀</button>
    <div class="wtitle"><span class="wicon" id="wIcon"></span><b id="wName"></b><span id="wSub"></span><div class="dots" id="dots"></div></div>
    <button class="arrow" id="next" aria-label="下一個世界">▶</button>
  </div>
  <div class="book" id="book">
    <canvas id="map" width="1248" height="1248" aria-label="世界地圖"></canvas>
    <div class="under" id="under"></div>
    <div class="leaf" id="leaf"><div class="face"><canvas id="leafCv" width="1248" height="1248"></canvas><div class="shade"></div></div><div class="face back" id="leafBack">📖</div></div>
    <div class="loading" id="loading"></div>
    <div class="toast" id="toast"></div><div class="tip" id="tip"></div>
  </div>
  <div class="bar"><span id="score"></span><span id="syncNote" style="font-size:14px;font-weight:500;opacity:.8"></span><span style="display:flex;gap:8px"><a href="points.html" id="ptLink" style="font:inherit;font-weight:700;border-radius:14px;padding:10px 16px;min-height:50px;background:rgba(255,255,255,.16);color:#fff;text-decoration:none;display:inline-flex;align-items:center">⚙️ 點數與設定</a><button id="zoom">🔍 放大地圖</button></span></div>
  <div id="examBox"></div>
  <div class="panel" id="panel"></div>
  <small>按 ◀ ▶ 或在地圖上左右滑動，可以翻到其他世界。每一關都可以直接挑戰，不用照順序。考完 AI 老師會講評、給 0～5 顆星，4 顆星以上就過關。點一下關卡看上次的講評，再點一次就去考試。用電腦時，滑鼠移到關卡上也看得到講評。</small>
</main>
<script src="sub-sync.js"></script>
<script>
(function(){
"use strict";
// 數學測驗在網站上的檔名（跟這個地圖放在同一個資料夾）
var QUIZ_PAGE = "subjects.html";
// 英文口說練習（英文 App）在網站上的檔名
var ENG_PAGE = "index.html";
var W = 1248, PASS = 4;

var $ = function(id){ return document.getElementById(id); };
var store = {
  get: function(k, d){ try{ var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set: function(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
var nameKey = function(n){ return String(n || "").toLowerCase(); };
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
function rnd(seed){ var x = Math.sin(seed * 9301 + 49297) * 233280; return x - Math.floor(x); }

// ════════════════════════════════════════════════════════════════
//  世界設定：每個世界 = 一張圖 + 關卡位置 + 路線 + 自己的動畫
//  關卡有 uid 就會連到測驗；沒有 uid 的是「準備中」
//  edges：[關卡a, 關卡b, [中間轉彎點...]]
// ════════════════════════════════════════════════════════════════
function chain(pts){ var e = []; for (var i = 0; i < pts.length - 1; i++) e.push([i, i + 1, []]); return e; }
function todo(pts){ return pts.map(function(p, i){ return {xy:p, tag:"第 " + (i + 1) + " 關"}; }); }

var WORLDS = [
  { id:"island", emoji:"🏝️", name:"數學島", sub:"6上（翰林）", img:"worlds/island.jpg", bg:"#123c59", assets:{sea:"worlds/island-sea.png"},
    levels:[
      {uid:"m6a-1",   tag:"6上-1",  name:"公因數與倍數", title:"一、最大公因數與最小公倍數", xy:[220,908]},
      {uid:"m6a-2",   tag:"6上-2",  name:"分數除法",     title:"二、分數除法",               xy:[235,650]},
      {uid:"m6a-3",   tag:"6上-3",  name:"小數除法",     title:"三、小數除法",               xy:[349,625]},
      {uid:"m6a-4",   tag:"6上-4",  name:"比與比值",     title:"四、比與比值",               xy:[530,481]},
      {uid:"m6a-r1", review:true,  tag:"綜合一", name:"1～4 單元",    title:"綜合練習（一）：第 1～4 單元", xy:[630,236]},
      {uid:"m6a-5",   tag:"6上-5",  name:"兩量關係",     title:"五、兩量關係",               xy:[945,221]},
      {uid:"m6a-6",   tag:"6上-6",  name:"圓周長",       title:"六、圓周長與扇形周長",       xy:[887,702]},
      {uid:"m6a-7",   tag:"6上-7",  name:"放大縮小",     title:"七、放大、縮小與比例尺",     xy:[822,632], labelUp:true},
      {uid:"m6a-8",   tag:"6上-8",  name:"怎樣解題",     title:"八、怎樣解題",               xy:[507,1000]},
      {uid:"m6a-r2", review:true,  tag:"綜合二", name:"5～8 單元",    title:"綜合練習（二）：第 5～8 單元", xy:[601,1000], labelUp:true},

}
function pickWorld(w, P){
  P = P || w.pick; if (!P) return null;
  var adj = {}; w.edges.forEach(function(e){ (adj[e[0]] = adj[e[0]] || []).push({to: e[1], way: e[2]}); (adj[e[1]] = adj[e[1]] || []).push({to: e[0], way: e[2].slice().reverse()}); });
  function path(a, b){   // 沿原本的路找 a→b，回傳中間要經過的轉彎點
    var prev = {}, q = [a]; prev[a] = null;
    while (q.length){ var x = q.shift(); if (x === b) break; (adj[x] || []).forEach(function(n){ if (!(n.to in prev)){ prev[n.to] = {from: x, way: n.way}; q.push(n.to); } }); }
    if (!(b in prev)) return [];
    var hops = [], y = b; while (prev[y]){ hops.unshift({node: y, way: prev[y].way}); y = prev[y].from; }
    var out = []; hops.forEach(function(h, i){ out = out.concat(h.way); if (i < hops.length - 1) out.push(w.pts[h.node]); });
    return out;
  }
  return {levels: P.levels.map(function(l, i){ return Object.assign({xy: w.pts[P.picks[i]]}, l); }),

function renderSetup(){

    '<div>① 在 Mac 的英文口說練習家長區打開「新裝置設定」的 QR Code，用這台的相機掃。掃完如果打開的是英文 App，在同一個瀏覽器再打開這個地圖就好。</div>' +
    '<div>② 直接在下面填（跟英文 App 家長區「點數雲端」那兩格一樣），或到 <a href="points.html" style="color:inherit">⚙️ 點數與設定</a> 貼上設定碼：</div>' +
    '<label>機器人網址<input id="suUrl" placeholder="https://script.google.com/macros/s/……/exec" autocomplete="off"></label>' +
    '<label>連線密碼<input id="suKey" type="password" autocomplete="off"></label>' +
    '<label>Gemini 金鑰（選填，AI 老師講評要用）<input id="suG" type="password" autocomplete="off"></label>' +
    '<button id="suGo">連上雲端</button><div id="suNote" style="font-size:14px;margin-top:6px"></div>';
  $("suGo").onclick = function(){
    var u = $("suUrl").value.trim(), k = $("suKey").value.trim(), g = $("suG").value.trim();
    if (!/^https:\/\/script\.google\.com\//.test(u) || !k){ $("suNote").textContent = "⚠️ 網址要是 https://script.google.com/ 開頭，密碼不能空白"; return; }
    store.set("ptCloudUrl", u); store.set("ptCloudKey", k); if (g && !store.get("gkey", "")) store.set("gkey", g);
